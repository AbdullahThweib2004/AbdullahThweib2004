<style>
.a{animation:rise .55s cubic-bezier(.2,.7,.2,1) backwards}
.g{animation:grow .9s cubic-bezier(.3,.8,.2,1) backwards;transform-box:fill-box;transform-origin:left center}
.p{animation:pop .6s cubic-bezier(.3,1.6,.4,1) backwards;transform-box:fill-box;transform-origin:center}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
</style>
